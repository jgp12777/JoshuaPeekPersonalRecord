<html>
<head>
  <title>Real-Time 3D Graphics with WebGL2</title>
  <link rel="shortcut icon" type="image/png" href="../common/images/favicon.png" />

  <!-- libraries -->
  <link rel="stylesheet" href="../common/lib/normalize.css">

  <!-- modules -->
  <script type="text/javascript" src="../common/js/utils.js"></script>

  <!-- vertex Shader -->
  <script id="vertex-shader" type="x-shader/x-vertex">
    #version 300 es
    precision mediump float;

    // Supplied vertex position attribute
    in vec3 aVertexPosition;

    void main(void) {
      // Set the position in clipspace coordinates
      gl_Position = vec4(aVertexPosition, 1.0);
    }
  </script>

  <!-- fragment Shader -->
  <script id="fragment-shader" type="x-shader/x-fragment">
    #version 300 es
    precision mediump float;

    // Color that is the result of this shader
    out vec4 fragColor;

    // Add a uniform for color
    uniform vec4 uColor;

    void main(void) {
      // Use the supplied color instead of hardcoded red
      fragColor = uColor;
    }
  </script>
  <script type="text/javascript">
    'use strict';

    // Global variables that are set and used
    // across the application
    let gl,
      program,
      squareVertexBuffer,
      squareIndexBuffer,
      indices;

    // Given an id, extract the content's of a shader script
    // from the DOM and return the compiled shader
    function getShader(id) {
      const script = document.getElementById(id);
      const shaderString = script.text.trim();

      // Assign shader depending on the type of shader
      let shader;
      if (script.type === 'x-shader/x-vertex') {
        shader = gl.createShader(gl.VERTEX_SHADER);
      }
      else if (script.type === 'x-shader/x-fragment') {
        shader = gl.createShader(gl.FRAGMENT_SHADER);
      }
      else {
        return null;
      }

      // Compile the shader using the supplied shader code
      gl.shaderSource(shader, shaderString);
      gl.compileShader(shader);

      // Ensure the shader is valid
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        return null;
      }

      return shader;
    }

    function initProgram() {
      const vertexShader = getShader('vertex-shader');
      const fragmentShader = getShader('fragment-shader');

      // Create a program
      program = gl.createProgram();
      // Attach the shaders to this program
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('Could not initialize shaders');
      }

      // Use this program instance
      gl.useProgram(program);
      // We attach the location of these shader values to the program instance
      // for easy access later in the code
      program.aVertexPosition = gl.getAttribLocation(program, 'aVertexPosition');
      program.uColor = gl.getUniformLocation(program, 'uColor');
    }

    // Set up the buffers for the square
    // Set up the buffers for the squares
    function initBuffers() {
      /*
        First Square        Second Square
        V0      V3          V4      V7
        X-------X           X-------X
        |       |           |       |
        |       |           |       |
        |       |           |       |
        X-------X           X-------X
        V1      V2          V5      V6
      */
      const vertices = [
        // First square (left)
        -0.8, 0.5, 0,    // V0
        -0.8, -0.5, 0,   // V1
        -0.2, -0.5, 0,   // V2
        -0.2, 0.5, 0,    // V3

        // Second square (right)
        0.2, 0.5, 0,     // V4
        0.2, -0.5, 0,    // V5
        0.8, -0.5, 0,    // V6
        0.8, 0.5, 0      // V7
      ];

      // Indices defined in counter-clockwise order
      indices = [
        // First square
        0, 1, 2,  // First triangle (V0, V1, V2)
        0, 2, 3,  // Second triangle (V0, V2, V3)

        // Second square
        4, 5, 6,  // First triangle (V4, V5, V6)
        4, 6, 7   // Second triangle (V4, V6, V7)
      ];

      // Setting up the VBO
      squareVertexBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, squareVertexBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);

      // Setting up the IBO
      squareIndexBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, squareIndexBuffer);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

      // Clean
      gl.bindBuffer(gl.ARRAY_BUFFER, null);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
    }


    // We call draw to render to our canvas
    function draw() {
      // Clear the scene

      gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);

      // Use the buffers we've constructed
      gl.bindBuffer(gl.ARRAY_BUFFER, squareVertexBuffer);
      gl.vertexAttribPointer(program.aVertexPosition, 3, gl.FLOAT, false, 0, 0);
      gl.enableVertexAttribArray(program.aVertexPosition);

      // Bind IBO
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, squareIndexBuffer);

      // Draw to the scene using triangle primitives
      gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);

      // Clean
      gl.bindBuffer(gl.ARRAY_BUFFER, null);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
    }

    function DrawSquare(x1, y1, x2, y2, x3, y3, x4, y4, color = [1.0, 0.0, 0.0, 1.0]) {
      // Create vertices for a square using the provided coordinates
      const vertices = [
        x1, y1, 0,    // Vertex 1
        x2, y2, 0,    // Vertex 2
        x3, y3, 0,    // Vertex 3
        x4, y4, 0     // Vertex 4
      ];

      // Indices for two triangles that form the square (counter-clockwise order)
      const squareIndices = [
        0, 1, 2,  // First triangle (V1, V2, V3)
        0, 2, 3   // Second triangle (V1, V3, V4)
      ];

      // Update global indices variable to be used in the draw function
      indices = squareIndices;

      // Create and bind vertex buffer
      gl.bindBuffer(gl.ARRAY_BUFFER, squareVertexBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);

      // Create and bind index buffer
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, squareIndexBuffer);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(squareIndices), gl.STATIC_DRAW);

      // Set the color uniform
      const colorLocation = gl.getUniformLocation(program, 'uColor');
      gl.uniform4fv(colorLocation, color);

      // Draw the square
      draw();
    }
    function DrawCube() {
      // Clear the scene before drawing
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);



      // Back face - blue
      DrawSquare(
              -0.15, 0.45,  // top-left
              -0.15, 0.05,  // bottom-left
              0.45, 0.05,   // bottom-right
              0.45, 0.45,   // top-right
              [0.0, 0.0, 1.0, 1.0]  // blue
      );



      // Bottom face - yellow
      DrawSquare(
              -0.3, -0.3,   // front-left
              -0.15, 0.05,  // back-left
              0.45, 0.05,   // back-right
              0.3, -0.3,    // front-right
              [1.0, 1.0, 0.0, 1.0]  // yellow
      );

      // Left face - cyan
      DrawSquare(
              -0.3, 0.3,    // front-top
              -0.3, -0.3,   // front-bottom
              -0.15, 0.05,  // back-bottom
              -0.15, 0.45,  // back-top
              [0.0, 1.0, 1.0, 1.0]  // cyan
      );

      // Right face - magenta
      DrawSquare(
              0.3, 0.3,     // front-top
              0.3, -0.3,    // front-bottom
              0.45, 0.05,   // back-bottom
              0.45, 0.45,   // back-top
              [1.0, 0.0, 1.0, 1.0]  // magenta
      );

      // Front face - red
      DrawSquare(
              -0.3, 0.3,    // top-left
              -0.3, -0.3,   // bottom-left
              0.3, -0.3,    // bottom-right
              0.3, 0.3,     // top-right
              [1.0, 0.0, 0.0, 1.0]  // red
      );
      // Top face - green
      DrawSquare(
              -0.3, 0.3,    // front-left
              -0.15, 0.45,  // back-left
              0.45, 0.45,   // back-right
              0.3, 0.3,     // front-right
              [0.0, 1.0, 0.0, 1.0]  // green
      );
    }



    // Entry point to our application
    // Entry point to our application
    function init() {
      // Retrieve the canvas
      const canvas = utils.getCanvas('webgl-canvas');

      // Set the canvas to the size of the screen
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      // Retrieve a WebGL context
      gl = utils.getGLContext(canvas);
      // Set the clear color to be black
      gl.clearColor(0, 0, 0, 1);

      // Initialize WebGL program
      initProgram();

      // Initialize buffers (only create them, don't populate yet)
      squareVertexBuffer = gl.createBuffer();
      squareIndexBuffer = gl.createBuffer();

      // Draw the cube illusion
      DrawCube();
    }

    // Call init once the webpage has loaded
    window.onload = init;
  </script>
</head>

<body>

  <canvas id="webgl-canvas">
    Your browser does not support the HTML5 canvas element.
  </canvas>

</body>
</html>
